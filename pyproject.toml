[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "turboquant-npu"
version = "0.1.0"
description = "TurboQuant KV cache quantization on Ascend NPU (torch-npu + triton-npu backends)"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
npu = ["torch-npu"]
triton = ["triton-ascend"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["turboquant_npu*"]

[tool.setuptools.package-data]
turboquant_npu = ["codebooks/*.json"]
